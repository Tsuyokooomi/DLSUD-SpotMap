<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotMap — Find places worth going to</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">●</span>
      <span class="brand-name">SpotMap</span>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search by name or tag, like 'Milktea'..." autocomplete="off">
      <button class="btn btn-primary search-btn" id="searchBtn">Search</button>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="topbar-actions" id="topbarActions">
      <div id="userProfile" class="user-profile" style="display: none;">
        <span class="user-email" id="userEmailBadge"></span>
      </div>
      <button class="btn btn-ghost" id="loginBtn">Log in</button>
      <button class="btn btn-primary" id="adminBtn" style="display: none;">+ Add Spot</button>
      <button class="btn btn-ghost" id="logoutBtn" style="display: none;">Log out</button>
    </div>
  </header>

  <!-- Category filter row -->
  <nav class="filters" id="filters">
    <button class="chip chip-active" data-category="all">All</button>
    <button class="chip" data-category="food">
      <span class="chip-dot dot-food"></span>Food
    </button>
    <button class="chip" data-category="cafe">
      <span class="chip-dot dot-cafe"></span>Cafe
    </button>
    <button class="chip" data-category="mall">
      <span class="chip-dot dot-mall"></span>Malls
    </button>
    <button class="chip" data-category="hangout">
      <span class="chip-dot dot-hangout"></span>Hangouts
    </button>

    <div class="tag-filter-wrap">
      <button class="chip" id="tagFilterBtn">Tags <span id="tagFilterCount"></span> ▾</button>
      <div class="tag-filter-panel" id="tagFilterPanel">
        <div class="tag-filter-list" id="tagFilterList"></div>
        <div class="tag-filter-footer">
          <button class="tag-filter-clear" id="tagFilterClear">Clear</button>
          <button class="tag-filter-apply" id="tagFilterApply">Apply</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Map -->
  <main id="map"></main>

  <!-- Empty state / place count -->
  <div class="status-pill" id="statusPill">Loading places…</div>

  <!-- Place detail card (populated by JS, shown on pin click) -->
  <template id="placeCardTemplate">
    <div class="place-card">
      <div class="place-card-edge"></div>
      <button class="place-card-close" aria-label="Close">×</button>
      <div class="place-card-image-wrap" style="display: none;">
        <img class="place-card-image" src="" alt="Spot photo" loading="lazy">
      </div>
      <div class="place-card-body">
        <div class="place-card-header">
          <span class="place-card-category"></span>
          <div class="place-admin-controls" style="display: none;">
            <button class="btn-card-action place-edit-btn" title="Edit spot">Edit</button>
            <button class="btn-card-action place-delete-btn" title="Delete spot">Delete</button>
          </div>
        </div>
        <h2 class="place-card-title"></h2>
        <p class="place-card-address"></p>
        <div class="place-card-tags"></div>
        <p class="place-card-desc"></p>

        <div class="place-card-actions">
          <button class="action-btn" data-action="star">
            <span class="action-icon">☆</span> Star
          </button>
          <button class="action-btn" data-action="togo">
            <span class="action-icon">📍</span> To-go
          </button>
        </div>

        <div class="place-card-comments">
          <h3>Community Notes</h3>
          <div class="comment-list"></div>
          <div class="comment-add">
            <input type="text" class="comment-input" placeholder="Add a note about this place...">
            <button class="comment-submit">Add</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Auth Modal (Log in / Sign up) -->
  <div class="modal-backdrop" id="authModal" style="display: none;">
    <div class="modal-card">
      <button class="modal-close-btn" id="authCloseBtn" aria-label="Close modal">×</button>
      <div class="modal-tabs">
        <button class="modal-tab active" id="tabLogin">Log In</button>
        <button class="modal-tab" id="tabSignup">Sign Up</button>
      </div>

      <form id="authForm" class="modal-form">
        <div class="form-group">
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" placeholder="you@dlsud.edu.ph" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div class="form-error" id="authError" style="display: none;"></div>
        <button type="submit" class="btn btn-primary form-submit-btn" id="authSubmitBtn">Log In</button>
      </form>
    </div>
  </div>

  <!-- Admin Modal (Add / Edit Place) -->
  <div class="modal-backdrop" id="placeModal" style="display: none;">
    <div class="modal-card modal-card-wide">
      <div class="modal-header-actions">
        <button type="button" class="modal-control-btn" id="placeModalMinBtn" aria-label="Minimize modal" title="Minimize to map">−</button>
        <button type="button" class="modal-control-btn" id="placeModalCloseBtn" aria-label="Close modal" title="Close">×</button>
      </div>
      <h2 class="modal-title" id="placeModalTitle">Add New Spot</h2>
      <p class="modal-subtitle">Add a pin to the SpotMap</p>

      <form id="placeForm" class="modal-form">
        <input type="hidden" id="placeIdInput" value="">
        <input type="hidden" id="placeLatInput" value="">
        <input type="hidden" id="placeLngInput" value="">
        
        <div class="form-group">
          <label for="placeNameInput">Spot Name *</label>
          <input type="text" id="placeNameInput" placeholder="e.g. Grumpy Joe Coffee" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="placeCategorySelect">Category *</label>
            <select id="placeCategorySelect" required>
              <option value="food">Food</option>
              <option value="cafe">Cafe</option>
              <option value="mall">Mall</option>
              <option value="hangout">Hangout</option>
            </select>
          </div>
          <div class="form-group">
            <label for="placeTagsInput">Tags (comma-separated)</label>
            <input type="text" id="placeTagsInput" placeholder="Coffee, Study spot, Wifi">
          </div>
        </div>

        <!-- Visual Location Selector (No manual Lat/Lng typing required) -->
        <div class="form-group">
          <label>Pin Location *</label>
          <div class="location-picker-card">
            <div class="location-status-row">
              <div class="location-status-badge" id="locationStatusBadge">
                <span class="location-pin-dot"></span>
                <span id="locationStatusText">No location selected</span>
              </div>
            </div>
            <div class="location-picker-actions">
              <button type="button" class="btn btn-ghost location-action-btn" id="useCurrentLocationBtn">
                <span>📍</span> Use My Current Location
              </button>
              <button type="button" class="btn btn-ghost location-action-btn" id="pickOnMapBtn">
                <span>📌</span> Drag Pin on Map
              </button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="placeAddressInput">Address / Landmark *</label>
          <input type="text" id="placeAddressInput" placeholder="e.g. Aguinaldo Hwy, Dasmariñas, Cavite" required>
        </div>

        <!-- Spot Photo Upload / Deselect Section -->
        <div class="form-group">
          <label>Spot Photo (optional)</label>
          <div class="image-upload-box" id="imageUploadBox">
            <input type="file" id="placeFileInput" accept="image/*" style="display: none;">
            <input type="hidden" id="placeImageUrlInput" value="">
            
            <!-- Click/Drag Dropzone -->
            <div class="image-dropzone" id="imageDropzone">
              <span class="image-dropzone-icon">📸</span>
              <div class="image-dropzone-text">Click to choose or drag a photo here</div>
              <span class="image-dropzone-sub">PNG, JPG, WEBP from your device</span>
            </div>

            <!-- Image Preview Box with Remove / Deselect Button -->
            <div class="image-preview-card" id="imagePreviewCard" style="display: none;">
              <img id="imagePreviewImg" src="" alt="Selected photo preview" class="image-preview-thumb">
              <div class="image-preview-details">
                <div class="image-preview-name" id="imagePreviewName">photo.jpg</div>
                <button type="button" class="btn-remove-image" id="removeImageBtn" title="Remove / Deselect photo">
                  ✕ Remove photo
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="placeDescInput">Description</label>
          <textarea id="placeDescInput" rows="3" placeholder="Brief description of the place, highlights, vibes..."></textarea>
        </div>

        <div class="form-error" id="placeModalError" style="display: none;"></div>
        <button type="submit" class="btn btn-primary form-submit-btn" id="placeSubmitBtn">Save Spot</button>
      </form>
    </div>
  </div>

  <!-- Minimized Modal Dock Pill -->
  <div class="minimized-dock-pill" id="minimizedPlacePill" style="display: none;">
    <div class="minimized-dock-content" id="restorePlaceModalBtn" title="Click to expand modal">
      <span class="minimized-dock-dot"></span>
      <span class="minimized-dock-text" id="minimizedPillTitle">Adding Spot (Click to expand)</span>
      <span class="minimized-dock-expand-icon">↗</span>
    </div>
    <button type="button" class="minimized-dock-close" id="closeMinimizedPlaceBtn" title="Discard and close">×</button>
  </div>

  <!-- Floating Bar during Map Pin Dragging / Picking -->
  <div class="map-picker-banner" id="mapPickerBanner" style="display: none;">
    <div class="map-picker-banner-content">
      <div class="map-picker-info">
        <span class="map-picker-pulse"></span>
        <div class="map-picker-text-wrap">
          <div class="map-picker-title" id="mapPickerTitle">Drag the pin or click on the map</div>
          <div class="map-picker-coords" id="pickerCoordsDisplay">Coordinates: —</div>
        </div>
      </div>
      <div class="map-picker-actions">
        <button type="button" class="btn btn-ghost" id="cancelPickOnMapBtn">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmLocationBtn">✓ Confirm Location</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
